
<section class="mx-auto max-w-2xl py-10 text-center sm:py-16">
  <p class="mb-3 text-sm font-semibold uppercase tracking-widest text-blue-600 dark:text-blue-400">
    Developer discovery
  </p>

  <h1 class="text-3xl font-bold tracking-tight text-slate-900 sm:text-5xl dark:text-white">
    Explore GitHub profiles
  </h1>

  <p class="mx-auto mt-5 max-w-xl text-base leading-7 text-slate-600 dark:text-slate-300">
    Search for developers, explore their public repositories, and discover
    the technologies they work with.
  </p>

  <form
    class="mx-auto mt-8 flex max-w-xl flex-col gap-3 sm:flex-row"
    (submit)="onSubmit(usernameInput.value, $event)"
    novalidate
  >
    <label class="sr-only" for="github-username">GitHub username</label>

    <input
      #usernameInput
      id="github-username"
      name="username"
      type="text"
      autocomplete="off"
      spellcheck="false"
      placeholder="Enter GitHub username"
      [attr.aria-invalid]="validationError() ? 'true' : null"
      [attr.aria-describedby]="validationError() ? 'username-error' : null"
      (input)="clearValidationError()"
      class="min-w-0 flex-1 rounded-lg border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none placeholder:text-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 dark:border-slate-700 dark:bg-slate-900 dark:text-white"
    />

    <button
      type="submit"
      class="rounded-lg bg-blue-600 px-6 py-3 font-semibold text-white transition hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
    >
      Search
    </button>
  </form>

  @if (validationError(); as error) {
    <p
      id="username-error"
      class="mt-3 text-left text-sm text-red-600 dark:text-red-400"
      role="alert"
    >
      {{ error }}
    </p>
  }

  <p class="mt-4 text-sm text-slate-500 dark:text-slate-400">
    Try a public GitHub username, such as octocat.
  </p>
</section>
